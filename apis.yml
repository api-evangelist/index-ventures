aid: index-ventures
name: Index Ventures
description: 'Index Ventures is a global venture capital firm founded in Geneva in 1996 by Neil Rimer,
  David Rimer and Giuseppe Zocco, and headquartered in London with offices in San Francisco, New York,
  Geneva and Jersey. The firm invests across the full startup lifecycle through dedicated vehicles: Origin
  (seed), Venture (early-stage) and Growth funds, backing companies from seed to IPO. It focuses on artificial
  intelligence and machine learning, business applications, data, fintech, security, healthcare, entertainment,
  media, mobility, retail, open source and the future of work. Index has raised roughly $15B in total
  capital, including $2.3B announced in 2024 ($800M early-stage, $1.5B later-stage). Notable investments
  include Adyen, Figma, Datadog, Discord, Revolut, Wise, Robinhood, Roblox, Confluent, Anthropic, Scale
  AI and Wiz. Its philosophy emphasizes backing founders on character and vision — ''we invest in who
  you are, not just what you do.'''
